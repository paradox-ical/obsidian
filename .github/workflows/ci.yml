name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: collective
          POSTGRES_PASSWORD: collective
          POSTGRES_DB: collective
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collective -d collective"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24.21.0
        uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Apply migrations
        run: npm run prisma:deploy
        env:
          DATABASE_URL: postgresql://collective:collective@localhost:5432/collective

      - name: Database integration test
        run: npm run test:integration
        env:
          DATABASE_URL: postgresql://collective:collective@localhost:5432/collective
          RUN_DB_TESTS: "1"

      - name: Local process boot check
        run: npm run boot:check
        env:
          DATABASE_URL: postgresql://collective:collective@localhost:5432/collective
          NODE_ENV: test
          DEFAULT_TIMEZONE: Australia/Perth
          BOT_HEALTH_HOST: 127.0.0.1
          BOT_HEALTH_PORT: "8081"
          WORKER_HEALTH_PORT: "8082"
          ADMIN_PORT: "5173"
          ADMIN_HOST: 127.0.0.1
